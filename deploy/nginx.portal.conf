# Phase-1 config: 高位端口 + 自签证书，用于 ICP 备案完成前先上线自测。
# 与 nginx.conf 逻辑完全一致（限速 / 安全头 / 反向代理），仅端口改为 8443、证书自签。
# 备案完成后切回 nginx.conf（443 + Let's Encrypt）即可，无需改应用。

limit_req_zone $binary_remote_addr zone=api_perip:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=login_perip:10m rate=120r/m;
limit_conn_zone $binary_remote_addr                 zone=perip_conn:10m;

server {
    listen 8443 ssl;
    http2 on;
    server_name swiftiejerry.xyz calendar.swiftiejerry.xyz;

    ssl_certificate     /etc/letsencrypt/live/swiftiejerry.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swiftiejerry.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 1m;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    limit_conn perip_conn 30;

    location /api/ {
        limit_req zone=api_perip burst=40 nodelay;
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=login_perip burst=60 nodelay;
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

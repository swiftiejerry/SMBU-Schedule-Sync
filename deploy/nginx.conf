# TLS termination + reverse proxy + EDGE RATE LIMIT for SMBU Schedule Sync.
#
# Why an edge limiter on top of the app's own sliding-window limiter?
#   - The app (FastAPI) enforces precise per-IP / per-student / per-username
#     budgets (see backend/app/config.py). It is the source of truth.
#   - nginx sits in front and absorbs connection floods + request spikes
#     BEFORE they ever reach the small backend box, so a cheap VPS cannot be
#     connection-starved by one abusive client.
#
# IMPORTANT (campus NAT): every SMBU student behind the campus gateway shares
# ONE source IP. So the EDGE login limit must stay GENEROUS — the real
# brute-force defense is the app's per-USERNAME bucket (6/min). A tight edge
# login limit would throttle the entire school during a launch-day surge.

# --- rate-limit zones (10 MB ≈ 160k distinct IPs) ---
limit_req_zone $binary_remote_addr zone=api_perip:10m   rate=60r/m;   # smoothed API ceiling
limit_req_zone $binary_remote_addr zone=login_perip:10m rate=120r/m;  # generous: school shares 1 IP
limit_conn_zone $binary_remote_addr                 zone=perip_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name swiftiejerry.xyz calendar.swiftiejerry.xyz;

    ssl_certificate     /etc/letsencrypt/live/swiftiejerry.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swiftiejerry.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    client_max_body_size 1m;

    # Let the app breathe on slow campus-portal calls.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # ---- security headers (security is a hard requirement) ----
    add_header X-Frame-Options           DENY always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # Cap concurrent connections per IP — the real edge "don't get starved" guard.
    limit_conn perip_conn 30;

    # ---- API: smoothed request ceiling ----
    location /api/ {
        limit_req zone=api_perip burst=40 nodelay;
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Login: stricter burst, but still generous at the edge (campus NAT) ----
    location = /api/auth/login {
        limit_req zone=login_perip burst=60 nodelay;
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA (static assets + index): no rate limit, let the monolith serve it ----
    location / {
        proxy_pass http://app:8770;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP -> HTTPS.
server {
    listen 80;
    server_name swiftiejerry.xyz calendar.swiftiejerry.xyz;
    return 301 https://$host$request_uri;
}

# 激活方式：将此文件移动到 .github/workflows/deploy.yml 后推送。
# 注意：通过 git push 推送 workflow 文件需要具有 `workflow` scope 的 token
# （GitHub OAuth App / Git Credential Manager 默认不含该 scope，会报
# "without workflow scope" 拒绝）。可用 GitHub PAT(workflow+repo) 或
# `gh auth login --scopes workflow` 解决；也可在 GitHub Web UI 直接创建该文件（不受此限制）。

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 打包源码（剔除密钥 / PII / 巨型依赖；与本地 deploy 的 tarball 口径一致）
      - name: Build source tarball
        run: |
          tar czf smbu-src.tgz \
            --exclude=node_modules --exclude=.venv --exclude='*.db' \
            --exclude='.env' --exclude='.pytest_cache' --exclude='.tmp' \
            --exclude='deploy/mock/raw' --exclude='_probe' \
            -C . smbu-calendar

      - name: Upload tarball to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_DEPLOY_KEY }}
          source: smbu-src.tgz
          target: /opt/smbu-src.tgz
          overwrite: true

      - name: Deploy on ECS (cert + build image + recreate containers)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_DEPLOY_KEY }}
          script: |
            set -e
            rm -rf /opt/smbu-calendar
            mkdir -p /opt/smbu-calendar
            tar xzf /opt/smbu-src.tgz -C /opt/smbu-calendar --strip-components=1
            cd /opt/smbu-calendar
            # deploy.sh 统一处理：阶段1 自签证书 + nginx.portal.conf（8443），
            # 阶段2 加 LETSENCRYPT=1 走 Let's Encrypt + nginx.conf（443）。
            # 直接调 deploy.sh 可避免 docker-compose 默认 NGINX_CONF=nginx.conf 的坑。
            bash deploy/deploy.sh
            docker image prune -f

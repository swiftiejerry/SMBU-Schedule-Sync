# One-command deploy on the Alibaba Cloud box.
#   docker compose -f deploy/docker-compose.yml up -d
#
# nginx (edge: TLS + rate limit) -> app (FastAPI monolith, 1 worker, non-root).
# Certs are mounted read-only from ./certs (self-signed for phase-1, or Let's Encrypt).
# The app's data dir is optional now that payments are dropped (sessions are RAM-only).
#
# NGINX_CONF selects the config: nginx.conf (443, 备案后) or nginx.portal.conf (8443, 自签).

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: smbu-calendar:latest
    restart: unless-stopped
    expose:
      - "8770"
    environment:
      SMBU_ALLOW_ORIGINS: "https://swiftiejerry.xyz"
      SMBU_DEBUG_RAW_ENDPOINT: "false"
      SMBU_PAYMENTS_ENABLED: "false"
      # If this box is itself on campus and can reach 10.100.x directly, leave blank.
      # If it is a cloud VPS whose egress is blocked by the campus gateway, point at
      # a host proxy (see deploy/proxy/). Example:
      # SMBU_UPSTREAM_PROXY: "http://host.docker.internal:8899"
      SMBU_UPSTREAM_PROXY: ""
      SMBU_TRUSTED_PROXIES: "172.16.0.0/12"
    # Optional: only if you later re-enable the ledger.
    # volumes:
    #   - ./app-data:/app/backend/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # Uses the HEALTHCHECK baked into the Dockerfile (/api/health).

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # 注意：宿主机 80 端口已被系统级 nginx 占用（自 2026-08-21 起运行，勿动），
    # 因此这里不映射 80，否则 docker 起不来（bind: address already in use）。
    # 阶段1（无备案）：走 8443 + 自签证书；阶段2（备案后）：走 443 + Let's Encrypt。
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - app

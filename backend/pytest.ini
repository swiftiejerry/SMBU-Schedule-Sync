[pytest]
# Without asyncio_mode=auto pytest skips every `async def test_*` in
# tests/test_webvpn.py ("async def functions are not natively supported") and
# reports them as failures. test_webvpn.py has its own __main__ runner, so the
# suite *looked* green for a while even though `pytest` alone was red.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
# These are warnings from pinned deps, not defects. Keep the signal clean.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 打包源码（剔除密钥 / PII / 巨型依赖；与本地 deploy 的 tarball 口径一致）
      - name: Build source tarball
        run: |
          tar czf smbu-src.tgz \
            --exclude=node_modules --exclude=.venv --exclude='*.db' \
            --exclude='.env' --exclude='.pytest_cache' --exclude='.tmp' \
            --exclude='deploy/mock/raw' --exclude='_probe' \
            -C . smbu-calendar

      - name: Upload tarball to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_DEPLOY_KEY }}
          source: smbu-src.tgz
          target: /opt/smbu-src.tgz
          overwrite: true

      - name: Deploy on ECS (build image + recreate containers)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_DEPLOY_KEY }}
          script: |
            set -e
            rm -rf /opt/smbu-calendar
            mkdir -p /opt/smbu-calendar
            tar xzf /opt/smbu-src.tgz -C /opt/smbu-calendar --strip-components=1
            cd /opt/smbu-calendar
            SMBU_ALLOW_ORIGINS="https://swiftiejerry.xyz" \
              docker compose -f deploy/docker-compose.yml build
            SMBU_ALLOW_ORIGINS="https://swiftiejerry.xyz" \
              docker compose -f deploy/docker-compose.yml up -d
            sleep 5
            curl -fsS http://127.0.0.1:8770/api/health && echo "HEALTH OK"
            docker image prune -f
